apiVersion: apps/v1
kind: Deployment
metadata:
  name: storybank
  namespace: sandbox-dev
  labels:
    app: storybank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storybank
  template:
    metadata:
      labels:
        app: storybank
    spec:
      containers:
      - name: storybank-app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: FLAG
          value: "actf{placeholder_flag}"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: storybank-service
  namespace: sandbox-dev
  labels:
    app: storybank
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: storybank
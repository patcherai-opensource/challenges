apiVersion: apps/v1
kind: Deployment
metadata:
  name: captcha1-deployment
  namespace: sandbox-dev
  labels:
    app: captcha1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: captcha1
  template:
    metadata:
      labels:
        app: captcha1
    spec:
      containers:
      - name: captcha1-app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: FLAG
          value: "FLAG{placeholder_flag}"
        - name: PORT
          value: "80"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: captcha1-service
  namespace: sandbox-dev
  labels:
    app: captcha1
spec:
  type: ClusterIP
  selector:
    app: captcha1
  ports:
  - name: http
    port: 8080
    targetPort: 80
    protocol: TCP

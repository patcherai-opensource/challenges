apiVersion: apps/v1
kind: Deployment
metadata:
  name: consolation
  namespace: sandbox-dev
  labels:
    app: consolation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consolation
  template:
    metadata:
      labels:
        app: consolation
    spec:
      containers:
      - name: consolation
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: consolation
  namespace: sandbox-dev
  labels:
    app: consolation
spec:
  type: ClusterIP
  selector:
    app: consolation
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
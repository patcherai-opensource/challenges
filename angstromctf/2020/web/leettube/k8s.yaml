apiVersion: apps/v1
kind: Deployment
metadata:
  name: leettube-deployment
  namespace: sandbox-dev
  labels:
    app: leettube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leettube
  template:
    metadata:
      labels:
        app: leettube
    spec:
      containers:
      - name: leettube
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: leettube-service
  namespace: sandbox-dev
  labels:
    app: leettube
spec:
  type: ClusterIP
  selector:
    app: leettube
  ports:
  - port: 8080
    targetPort: 8000
    protocol: TCP
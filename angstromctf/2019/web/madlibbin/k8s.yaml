apiVersion: apps/v1
kind: Deployment
metadata:
  name: madlibbin
  namespace: sandbox-dev
  labels:
    app: madlibbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: madlibbin
  template:
    metadata:
      labels:
        app: madlibbin
    spec:
      restartPolicy: Always
      containers:
      - name: madlibbin-app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        - name: REDIS_HOST
          value: "localhost"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      - name: madlibbin-redis
        image: /:-redis
        imagePullPolicy: Always
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: madlibbin-service
  namespace: sandbox-dev
  labels:
    app: madlibbin
spec:
  type: ClusterIP
  selector:
    app: madlibbin
  ports:
  - name: http
    port: 8080
    targetPort: 3000
    protocol: TCP
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-you
  namespace: sandbox-dev
  labels:
    app: control-you
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-you
  template:
    metadata:
      labels:
        app: control-you
    spec:
      containers:
      - name: app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: control-you-service
  namespace: sandbox-dev
  labels:
    app: control-you
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: control-you
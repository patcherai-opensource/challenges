apiVersion: apps/v1
kind: Deployment
metadata:
  name: jar-challenge
  namespace: sandbox-dev
  labels:
    app: jar-challenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jar-challenge
  template:
    metadata:
      labels:
        app: jar-challenge
    spec:
      containers:
      - name: jar-app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        - name: PORT
          value: "5000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: jar-challenge-service
  namespace: sandbox-dev
  labels:
    app: jar-challenge
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
  selector:
    app: jar-challenge
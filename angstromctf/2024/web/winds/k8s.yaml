apiVersion: apps/v1
kind: Deployment
metadata:
  name: winds-deployment
  namespace: sandbox-dev
  labels:
    app: winds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: winds
  template:
    metadata:
      labels:
        app: winds
    spec:
      containers:
      - name: app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: winds-service
  namespace: sandbox-dev
  labels:
    app: winds
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8000
    protocol: TCP
  selector:
    app: winds

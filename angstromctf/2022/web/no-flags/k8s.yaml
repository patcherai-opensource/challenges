apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-flags
  namespace: sandbox-dev
  labels:
    app: no-flags
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-flags
      component: web
  template:
    metadata:
      labels:
        app: no-flags
        component: web
    spec:
      containers:
      - name: no-flags-app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: false
          readOnlyRootFilesystem: false
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: no-flags-service
  namespace: sandbox-dev
  labels:
    app: no-flags
    component: web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: no-flags
    component: web